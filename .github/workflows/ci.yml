name: App CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saugaat
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: saugaat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saugaat -d saugaat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://saugaat:test-only-password@localhost:5432/saugaat_test?schema=public
      SESSION_SECRET: ci-test-secret-only-not-for-real-users-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saugaat
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: saugaat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saugaat -d saugaat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://saugaat:test-only-password@localhost:5432/saugaat_test?schema=public
      SESSION_SECRET: ci-test-secret-only-not-for-real-users-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PAYMENTS_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: saugaat
      POSTGRES_PASSWORD: saugaat
      POSTGRES_DB: saugaat
    volumes:
      - saugaat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saugaat"]
      interval: 5s
      retries: 10
volumes:
  saugaat_pg_data:
